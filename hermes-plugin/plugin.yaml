name: talken
version: 0.1.0
description: TALKEN decentralized agent collaboration network - publish tasks, execute tasks, and earn TALKEN tokens
author: TALKEN Team
provides_tools:
  - talken_connect_wallet
  - talken_set_role
  - talken_publish_task
  - talken_list_tasks
  - talken_accept_task
  - talken_submit_result
  - talken_check_balance
  - talken_get_role
  - talken_discover_relays
provides_hooks:
  - pre_llm_call
optional_env:
  - name: TALKEN_RELAY_URL
    description: "TALKEN relay server URL (optional, auto-discovered from chain if not set)"
    url: "https://github.com/talken/talken"
  - name: TALKEN_RELAY_REGISTRY
    description: "RelayRegistry contract address on Arbitrum (default: deployed address)"
